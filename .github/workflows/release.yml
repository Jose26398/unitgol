name: Release

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Optional GitHub App client ID for automatic release PR checks
        type: string
        required: false
        default: ""
    secrets:
      app-private-key:
        description: Private key for the GitHub App installed on this repository
        required: false

permissions: {}

jobs:
  release-please:
    name: Release please
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Create release token
        if: ${{ inputs.app-client-id != '' }}
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: master
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ steps.app-token.outputs.token || github.token }}
